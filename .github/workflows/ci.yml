name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .

      - name: The lane-controller pin names a commit on lane-controller main
        # A pin to a feature-branch commit resolves until that branch is
        # deleted and then breaks `pip install` for everyone. It is a TEST
        # dependency here, so the failure would be "the suite cannot run",
        # which is the quietest way for a guarantee to stop being one.
        run: bash .github/scripts/check-lane-controller-pin.sh

      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: No real personal data in the repository
        run: |
          node .github/scripts/check-no-real-data.js --self-test
          node .github/scripts/check-no-real-data.js

  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The lowest version supported and a current one. This runs on whatever
        # the lane's box ships; the tests must not quietly depend on a newer
        # interpreter than that.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[dev]'

      - name: Build the user agent this build was tested against
        # baresip is an INSTALL REQUIREMENT of the agent, not a dependency of
        # this package, and it is built from source at the exact tag the agent
        # refuses to start without: Debian and Ubuntu package older releases
        # that carry neither `mixausrc` (which plays one file into ONE leg) nor
        # `mixminus` (which IS the bridge), so an apt install would leave the
        # only measurements in this suite that touch SIP unable to run.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libssl-dev
          git clone --quiet --depth 1 -b v4.11.0 https://github.com/baresip/re.git /tmp/re
          cmake -S /tmp/re -B /tmp/re/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/re/build -j"$(nproc)" >/dev/null
          sudo cmake --install /tmp/re/build >/dev/null
          sudo ldconfig
          git clone --quiet --depth 1 -b v4.11.0 \
            https://github.com/baresip/baresip.git /tmp/baresip
          cmake -S /tmp/baresip -B /tmp/baresip/build -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build /tmp/baresip/build -j"$(nproc)" >/dev/null
          sudo cmake --install /tmp/baresip/build >/dev/null
          sudo ldconfig
          test -f /usr/local/lib/baresip/modules/mixminus.so
          test -f /usr/local/lib/baresip/modules/mixausrc.so
          test -f /usr/local/lib/baresip/modules/ctrl_tcp.so

      - name: Tests
        # No hardware, no camera, no barrier, no SMTP server and no database.
        # Every target is a real HTTP server on an ephemeral socket, including a
        # REAL lane built from the installed lane-controller: a fake shaped like
        # our lane would make "the same code reads ours and a third party's" a
        # claim about two fakes.
        #
        # REQUIRE_SIP=1 turns a missing baresip into a FAILURE rather than a
        # skip. The SIP tests are the only measurements in this suite that touch
        # SIP at all -- a real registrar, three real user agents, real RTP, real
        # RFC 4733 DTMF and the audio each side received, measured -- and a
        # guarantee test that can skip silently is not a guarantee.
        env:
          REQUIRE_SIP: "1"
        run: pytest -q

      - name: Fail-control — monitor and capture
        # Breaks each property these two processes exist to have and requires the
        # suite to go red on every one. For the monitor: its lack of any opening
        # authority, its distance from the lane it reads, `unknown` not being
        # `ok`, transitions rather than states, `never_alarm` read from the wire
        # as a BOOLEAN, a `state` outside the contract's three refused, an HTTP
        # refusal reported as an answer rather than as silence, `lane_id` only on
        # a lane's notifications, the startup message built from one enumeration,
        # nothing following a redirect, credentials from files and never from a
        # URL, the site's threshold rather than a constant, and a sink failure
        # being reported. For the capture process: no POST at a camera, no import
        # of the lane it reads, one opener and it follows nothing, no credential
        # in a snapshot URL, no lane event detail on a record, `entry_pending`
        # not a trigger, an atomic write, an index rebuilt from the disk, an
        # orphan reported, a purge that applies BOTH age and size, a refused
        # write that is named, the retention default having one copy, no size
        # figure in the document, `camera_feed_frozen` on identical bytes only, a
        # dead camera never reading `ok`, a credential on the images route, an id
        # never becoming a path, and a camera's name surviving to the message.
        # AND THE ROUND-4 CUT, one break per blocker: a record filed without
        # being built through the contract, a naive lane timestamp followed
        # rather than refusing the page, the records route raising on what it
        # finds, a purge run for a capture that can never fit, an unbounded size
        # purge, crash leftovers surviving a rebuild, a live write leaving its
        # temporary files, the ends of a list published as oldest and newest, a
        # size purge taking the first written, a stepped clock going unsaid, a
        # lost backlog raising no code and counting nothing, a snapshot read with
        # no deadline over it, a camera that never answered absent from the
        # health payload, the two-clocks note coming apart from its one copy, a
        # negative subtraction hidden, and a backwards cursor adopted.
        # Each break fails in the REASSURING direction, because that is the
        # direction this kind of software fails in when nobody is looking.
        run: python scripts/monitor_fail_control.py

      - name: Fail-control — the agent
        # Breaks each property the AGENT exists to have and requires the suite
        # to go red on every one: a verb that opens something, an act existing
        # at all, the socket module able to see a lane, a socket opened
        # elsewhere, an undeclared intercom guessed at, an unrecognised reason
        # mapped to the nearest thing we know, a dead engine told to a driver as
        # a dirty plate, `never_alarm` read from a list instead of the wire, an
        # invented reason in the subset, a missing recording started on, a
        # language skipped, the site's order replaced by ours, a disabled
        # authorisation accepted, a disabled authorisation offered, the person
        # not told the barrier cannot move, the bridge made before the briefing,
        # each of the three timers never firing, a second call answered, the one
        # caller-supplied field taking anything, a user agent version not
        # checked, an unknown registration published as healthy, a health
        # payload shipping a subset, a sentence edited without its audio, an
        # intercom with no lane, a site that enables nothing, a transfer quietly
        # not offered, one account for both legs, a password in a SIP URI, the
        # agent's surface accepting a write, and it binding off loopback with no
        # credential.
        run: python scripts/agent_fail_control.py
